name: MoonWitness module kernel

on:
  push:
    paths:
      - "Cargo.toml"
      - "moonwitness-module/**"
      - "moonwitness-addon-audit/**"
      - ".github/workflows/moonwitness-module.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "moonwitness-module/**"
      - "moonwitness-addon-audit/**"
      - ".github/workflows/moonwitness-module.yml"

jobs:
  module-kernel:
    name: Test module kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check workspace formatting
        run: cargo fmt --all -- --check
      - name: Run module kernel tests
        run: cargo test -p moonwitness-module
      - name: Check ORM module-runtime feature integration
        run: cargo check -p sea-orm --features module-runtime
      - name: Run audit add-on tests
        run: cargo test -p moonwitness-addon-audit
      - name: Check module kernel documentation
        run: cargo doc -p moonwitness-module -p moonwitness-addon-audit --no-deps
