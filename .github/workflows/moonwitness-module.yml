name: MoonWitness module kernel

on:
  push:
    paths:
      - "Cargo.toml"
      - "moonwitness-module/**"
      - ".github/workflows/moonwitness-module.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "moonwitness-module/**"
      - ".github/workflows/moonwitness-module.yml"

jobs:
  module-kernel:
    name: Test module kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run module kernel tests
        run: cargo test -p moonwitness-module
      - name: Check module kernel documentation
        run: cargo doc -p moonwitness-module --no-deps
