[package]
name = "moonwitness-module"
version = "0.1.0"
description = "Static, typed module kernel for the MoonWitness Rust data platform"
edition = "2024"
rust-version = "1.94.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/BRIDGE-ALLAH/MW-ORM"

[dependencies]
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
